name: Synchroniser les séances

on:
  schedule:
    - cron: '17 10 * * *' # 10 h 17 UTC (5 h 17 l'hiver, 6 h 17 l'été à Québec) ; GitHub retarde souvent de plusieurs heures, l'heure pile est la plus chargée
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run sync-showtimes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
