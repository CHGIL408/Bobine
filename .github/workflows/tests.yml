name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false # un échec côté frontend n'arrête pas le backend, et inversement
      matrix:
        app: [backend, frontend]
    name: Tests ${{ matrix.app }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
